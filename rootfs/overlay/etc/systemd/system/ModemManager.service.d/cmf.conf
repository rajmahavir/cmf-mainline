# /etc/systemd/system/ModemManager.service.d/cmf.conf
# Use the CCCI-capable ModemManager build (mtk-ccci plugin) after the modem
# is powered by cmf-modem.service.
[Unit]
After=cmf-modem.service cmf-speechd.service
Wants=cmf-modem.service cmf-speechd.service

[Service]
ExecStart=
ExecStart=/opt/cmf-mm-ccci-build/out/src/ModemManager --log-level=INFO
StandardError=journal
