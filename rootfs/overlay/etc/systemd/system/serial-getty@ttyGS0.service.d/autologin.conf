# /etc/systemd/system/serial-getty@ttyGS0.service.d/autologin.conf
# Native-boot bring-up: the USB ACM port (configured by the initramfs) keeps
# the same root rescue shell the chroot boot offers on ttyGS0.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --keep-baud 115200,57600,38400,9600 - $TERM
