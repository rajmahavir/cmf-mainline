# /etc/systemd/system/phosh.service.d/cmf.conf
# CMF Phone 1: the same GPU environment cmf-phosh-direct gives the chroot
# session: phoc renders with GLES2 on the Panthor node (Mesa 26.3), scans out
# on the mediatek-drm card, PanVK opt-in, GTK 4 on the GL renderer.
[Unit]
# Not after cmf-wifi-calibrate: Wi-Fi comes up in the background (~14 s);
# the lock screen doesn't wait for it.
After=systemd-user-sessions.service

[Service]
Environment=WLR_BACKENDS=drm,libinput
Environment=WLR_DRM_DEVICES=/dev/dri/card0
Environment=WLR_RENDERER=gles2
Environment=WLR_RENDER_DRM_DEVICE=/dev/dri/renderD128
Environment=WLR_DRM_NO_MODIFIERS=1
Environment=LD_LIBRARY_PATH=/opt/cmf-mesa-26.3/lib
Environment=PAN_I_WANT_A_BROKEN_VULKAN_DRIVER=1
Environment=GSK_RENDERER=ngl
